version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: hhgoa-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hhgoa-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - ENVIRONMENT=development
      - MOCK_EXTERNAL_APIS=true
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./indices:/app/indices
      - ./data:/app/data

volumes:
  qdrant_data:
